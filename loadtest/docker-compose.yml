services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  miniserver-mock:
    build: ./miniserver_mock
    environment:
      MOCK_DELAY_MS: ${MOCK_DELAY_MS:-0}
      MOCK_FAIL_RATE: ${MOCK_FAIL_RATE:-0}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/_stats', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  loxmqttrelay:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      mosquitto:
        condition: service_healthy
      miniserver-mock:
        condition: service_healthy
    volumes:
      - ./relay-config:/app/config:ro
    environment:
      LOG_LEVEL: WARNING
    ports:
      - "11884:11884/udp"

  loadtest-runner:
    build: ./runner
    depends_on:
      mosquitto:
        condition: service_healthy
      miniserver-mock:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      RELAY_UDP_HOST: loxmqttrelay
      RELAY_UDP_PORT: 11884
      MOCK_HOST: miniserver-mock
      MOCK_PORT: 8080
      NUM_MESSAGES: ${NUM_MESSAGES:-5000}
      NUM_TOPICS: ${NUM_TOPICS:-50}
      SCENARIOS: ${SCENARIOS:-1,2,3}
    profiles: ["run"]

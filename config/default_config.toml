[general]
log_level = "INFO"
base_topic = "test/"
cache_size = 100000

[broker]
host = "test.mosquitto.org"
port = 1884
user = ""  # null becomes empty string in TOML
password = ""  # null becomes empty string in TOML
client_id = "loxmqttrelay"
# MQTT protocol version: "3.1" (default) for MQTT 3.1.x, "5" for MQTT 5
mqtt_version = "3.1"

[miniserver]
miniserver_ip = "127.0.0.1"
miniserver_port = 80
miniserver_user = ""
miniserver_pass = ""
miniserver_max_parallel_connections = 5
sync_with_miniserver = false
use_websocket = true
# If true, a miniserver whitelist sync only adds newly discovered topics
# instead of replacing the whitelist outright, so an incomplete sync can
# never silently drop a previously-known-good topic (the whitelist can only
# grow; a few extra forwarded topics are harmless, the Miniserver rejects
# them).
whitelist_sync_defensive = true
# If > 0, re-run the whitelist sync automatically every N seconds, in
# addition to sync-on-startup and sync-on-"miniserverevent/startup". 0
# disables periodic sync.
whitelist_sync_interval_seconds = 0

[topics]
subscriptions = ["topic3"]
subscription_filters = []
topic_whitelist = []
do_not_forward = []

[processing]
expand_json = false
convert_booleans = false

[udp]
udp_in_port = 11884

[debug]
mock_ip = ""
enable_mock = false


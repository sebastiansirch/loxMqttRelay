[general]
log_level = "INFO"
base_topic = "test/"
cache_size = 100000

[broker]
host = "test.mosquitto.org"
port = 1884
user = ""  # null becomes empty string in TOML
password = ""  # null becomes empty string in TOML
client_id = "loxmqttrelay"
# MQTT protocol version: "3.1" (default) for MQTT 3.1.x, "5" for MQTT 5
mqtt_version = "3.1"

[miniserver]
miniserver_ip = "127.0.0.1"
miniserver_port = 80
miniserver_user = ""
miniserver_pass = ""
miniserver_max_parallel_connections = 5
sync_with_miniserver = false
use_websocket = true
# HTTP forwarding: attempts (incl. the first) before a transient failure
# (timeout, connection error, 5xx) is given up on, and the base delay in
# seconds for the exponential backoff between attempts (0.5 -> 0.5s, 1s, 2s, ...).
miniserver_http_retry_attempts = 3
miniserver_http_retry_backoff_seconds = 0.5

[topics]
subscriptions = ["topic3"]
subscription_filters = []
topic_whitelist = []
do_not_forward = []

[processing]
expand_json = false
convert_booleans = false

[udp]
udp_in_port = 11884

[debug]
mock_ip = ""
enable_mock = false


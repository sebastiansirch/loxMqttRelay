[general]
log_level = "INFO"
base_topic = "test/"
cache_size = 100000

[broker]
host = "test.mosquitto.org"
port = 1884
user = ""  # null becomes empty string in TOML
password = ""  # null becomes empty string in TOML
client_id = "loxmqttrelay"
# MQTT protocol version: "3.1" (default) for MQTT 3.1.x, "5" for MQTT 5
mqtt_version = "3.1"

[miniserver]
miniserver_ip = "127.0.0.1"
miniserver_port = 80
miniserver_user = ""
miniserver_pass = ""
miniserver_max_parallel_connections = 5
sync_with_miniserver = false
use_websocket = true
# loxwebsocket's own reconnect() waits a fixed 15s before every reconnect
# attempt, including the first one after a disconnect. This replaces that
# with exponential backoff instead: the very first attempt is always
# immediate, the second attempt waits
# miniserver_websocket_reconnect_initial_delay_seconds, each further
# attempt's wait is multiplied by
# miniserver_websocket_reconnect_backoff_multiplier, capped at
# loxwebsocket's own 15s delay (default: 0s, 1s, 2s, 4s, 8s, 15s, 15s, ...).
miniserver_websocket_reconnect_initial_delay_seconds = 1.0
miniserver_websocket_reconnect_backoff_multiplier = 2.0

[topics]
subscriptions = ["topic3"]
subscription_filters = []
topic_whitelist = []
do_not_forward = []

[processing]
expand_json = false
convert_booleans = false

[udp]
udp_in_port = 11884

[debug]
mock_ip = ""
enable_mock = false

